name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --stacktrace --no-daemon

      # Starts a real client + dedicated server, walks through every warning state
      # and takes screenshots (see src/gametest).
      - name: Client gametests
        timeout-minutes: 20
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq mesa-vulkan-drivers > /dev/null
          mkdir -p build/run/clientGameTest
          echo "eula=true" > build/run/clientGameTest/eula.txt
          printf 'version:4896\npreferredGraphicsBackend:"vulkan"\n' > build/run/clientGameTest/options.txt
          ./gradlew runClientGameTest --no-daemon

      - name: Collect screenshots
        if: always()
        run: |
          mkdir -p shots
          find build/run -path '*screenshots*' \( -name '*.png' -o -name 'notes.txt' \) -exec cp {} shots/ \; || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gametest-screenshots
          path: shots

      - uses: actions/upload-artifact@v4
        with:
          name: PingGuard
          path: build/libs/*

      - name: Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(grep '^version=' gradle.properties | cut -d= -f2)
          FILES="build/libs/pingguard-${VERSION}.jar build/libs/PingGuard-ResourcePack-${VERSION}.zip"
          if gh release view "v${VERSION}" > /dev/null 2>&1; then
            gh release upload "v${VERSION}" $FILES --clobber
          else
            gh release create "v${VERSION}" $FILES --target "${GITHUB_SHA}" --title "PingGuard ${VERSION}" --notes-file .github/release-notes.md
          fi
          # leftover branch from the first CI runs
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" --delete ci-report 2>/dev/null || true
