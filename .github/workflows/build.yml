name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --stacktrace --no-daemon

      # Starts a real client + dedicated server, walks through every warning state
      # and takes screenshots (see src/gametest).
      - name: Client gametests
        timeout-minutes: 20
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq mesa-vulkan-drivers > /dev/null
          mkdir -p build/run/clientGameTest
          echo "eula=true" > build/run/clientGameTest/eula.txt
          printf 'version:4896\npreferredGraphicsBackend:"vulkan"\n' > build/run/clientGameTest/options.txt
          ./gradlew runClientGameTest --no-daemon

      - name: Collect screenshots
        if: always()
        run: |
          mkdir -p shots
          find build/run -path '*screenshots*' \( -name '*.png' -o -name 'notes.txt' \) -exec cp {} shots/ \; || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gametest-screenshots
          path: shots

      - uses: actions/upload-artifact@v4
        with:
          name: PingGuard
          path: build/libs/*

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" build/libs/pingguard-*.jar build/libs/PingGuard-ResourcePack-*.zip \
            --title "PingGuard ${GITHUB_REF_NAME}" --notes-file .github/release-notes.md || \
          gh release upload "${GITHUB_REF_NAME}" build/libs/pingguard-*.jar build/libs/PingGuard-ResourcePack-*.zip --clobber
