name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        id: build
        run: |
          chmod +x gradlew
          set +e
          ./gradlew build --stacktrace --no-daemon 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Probe Minecraft API signatures
        if: always()
        run: |
          set +e
          JAR=$(find ~/.gradle/caches/fabric-loom -name '*.jar' 2>/dev/null | tr '\n' ':')
          echo "jar: $JAR" > probe.txt
          for c in \
            net.minecraft.client.gui.GuiGraphicsExtractor \
            net.minecraft.network.chat.Style \
            net.minecraft.network.chat.FontDescription \
            'net.minecraft.network.chat.FontDescription$Resource' \
            net.minecraft.network.Connection \
            net.minecraft.server.network.ServerCommonPacketListenerImpl \
            net.minecraft.network.protocol.common.ClientboundResourcePackPushPacket \
            net.minecraft.network.protocol.common.ServerboundResourcePackPacket \
            net.minecraft.network.protocol.game.ClientboundSetTitlesAnimationPacket \
            net.minecraft.network.protocol.game.ClientboundClearTitlesPacket \
            net.minecraft.client.multiplayer.PlayerInfo \
            net.minecraft.server.permissions.PermissionLevel ; do
            echo "=== $c" >> probe.txt
            javap -p -cp "$JAR" "$c" >> probe.txt 2>&1
          done
          ls ~/.gradle/caches/fabric-loom 2>/dev/null >> probe.txt

      - name: Probe behaviour facts
        if: always()
        run: |
          set +e
          CP=$(find ~/.gradle/caches/fabric-loom -name '*.jar' 2>/dev/null | tr '\n' ':')
          javap -p -c -cp "$CP" net.minecraft.client.gui.Gui > /tmp/gui.txt 2>&1
          python3 tools/ci_facts.py /tmp/gui.txt gui >> probe.txt
          for k in $(find ~/.gradle/caches/fabric-loom -name '*.jar' -exec unzip -l {} \; 2>/dev/null | grep -o 'net/minecraft/client/gui/font/providers/BitmapProvider[^ ]*\.class' | sort -u); do
            c=${k%.class}; c=${c//\//.}
            javap -p -c -cp "$CP" "$c" > /tmp/bp.txt 2>&1
            echo "=== facts $c" >> probe.txt
            python3 tools/ci_facts.py /tmp/bp.txt bitmap >> probe.txt
          done

      - name: Upload jars
        if: steps.build.outputs.code == '0'
        uses: actions/upload-artifact@v4
        with:
          name: PingGuard
          path: build/libs/*

      - name: Publish CI report branch
        if: always()
        run: |
          set +e
          mkdir -p /tmp/report
          cp build.log probe.txt /tmp/report/ 2>/dev/null
          grep -nE "error:|warning:|FAILED|BUILD|Exception|\.java:[0-9]+" build.log | head -300 > /tmp/report/errors.txt
          cp build/libs/*.jar build/libs/*.zip /tmp/report/ 2>/dev/null
          cd /tmp/report
          git init -q -b ci-report
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          echo "build exit code: ${{ steps.build.outputs.code }} (commit ${{ github.sha }})" > STATUS.txt
          git add -A
          git commit -qm "CI report for ${{ github.sha }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-report

      - name: Fail if build failed
        if: steps.build.outputs.code != '0'
        run: exit 1
